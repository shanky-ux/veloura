<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200" role="img" aria-label="Veloura — The Art of Fine Living">
  <defs>
    <radialGradient id="glow" cx="30%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="26" fill="#0B0B0B"/>
  <rect width="720" height="200" rx="26" fill="url(#glow)"/>
  <rect x="0" y="0" width="720" height="200" rx="26" fill="none" stroke="#2A2A2A" stroke-width="1"/>

  <!-- Gold monogram mark -->
  <rect x="14" y="14" width="84" height="84" rx="20" fill="#111111" stroke="rgba(212,175,55,0.35)" stroke-width="1.5"/>
  <path d="M42 30 L55 70 L68 30" fill="none" stroke="#D4AF37" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="118" y="72" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#FFFFFF">Veloura</text>
  <text x="121" y="98" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#D4AF37">THE ART OF FINE LIVING</text>

  <!-- Hairline -->
  <rect x="60" y="150" width="600" height="1" fill="rgba(212,175,55,0.28)"/>
  <text x="60" y="172" font-family="Manrope, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="3" fill="#8A8A8A">QUIET LUXURY, CURATED FOR YOU</text>
</svg>
