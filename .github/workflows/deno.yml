name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm --prefix ecommerce-backend ci

      - name: Validate backend syntax
        run: node --check ecommerce-backend/server.js

      - name: Validate frontend syntax
        run: node --check ecommerce-frontend/app.js
